name: 每日维C提醒
 
on:
  # schedule:
    # UTC 时间 05:00 = 北京时间 13:00
    # - cron: '0 5 * * *'
    # 由cron-job自动触发，避免时间不准
  workflow_dispatch:  # 保留手动触发，方便测试

jobs:
 # 发送消息
  send-reminder:
    name: 发送维C提醒
    runs-on: ubuntu-latest
    
    steps:
      # 使用现成的 Pushover Action，不需要拉取代码
      - name: 发送 Pushover 通知
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          set -e

          http_code=$(curl -s -o /tmp/pushover_body.txt -w '%{http_code}' \
            -F "token=$PUSHOVER_TOKEN" \
            -F "user=$PUSHOVER_USER" \
            -F "title=🍊 维C时间到！" \
            -F "message=主人主人！🥺 再不吃维C就要变成橘子干啦！快去吃一片～" \
            -F "sound=Classical" \
            https://api.pushover.net/1/messages.json

          echo "HTTP 状态码: $http_code"
          echo "响应内容: $(cat /tmp/pushover_body.txt)"

          if [ "$http_code" != "200" ]; then
            echo "❌ Pushover 发送失败"
            exit 1
          fi

          echo "✅ 通知发送成功"
