name: 每日提醒合集

on:
  # schedule 全部注释，由 cron-job.org 触发
  # - cron: '0 5 * * *'    # 维C：每天 UTC 05:00 = 北京 13:00
  # - cron: '30 4 15 * *'  # iPad：每月15日 UTC 05:00 = 北京 13:00
  workflow_dispatch:
    inputs:
      task:
        description: '选择要发送的提醒'
        type: choice
        required: true
        default: vitamin-c
        options:
          - vitamin-c     # 每日维C提醒
          - ipad-photo    # 每月iPad图片更换提醒
          - both          # 两个都发（测试用）

jobs:
  vitamin-c:
    name: 发送维C提醒
    runs-on: ubuntu-latest
    if: inputs.task == 'vitamin-c' || inputs.task == 'both'
    steps:
      - name: 发送 Pushover 通知
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          curl -s \
            -F "token=$PUSHOVER_TOKEN" \
            -F "user=$PUSHOVER_USER" \
            -F "title=🍊 维C时间到！" \
            -F "message=主人主人！🥺 再不吃维C就要变成橘子干啦！快去吃一片～" \
            -F "sound=Classical" \
            https://api.pushover.net/1/messages.json

  ipad-photo:
    name: 发送 iPad 图片更换提醒
    runs-on: ubuntu-latest
    if: inputs.task == 'ipad-photo' || inputs.task == 'both'
    steps:
      - name: 发送 Pushover 通知
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          curl -s \
            -F "token=$PUSHOVER_TOKEN" \
            -F "user=$PUSHOVER_USER" \
            -F "title=🌊 换图时间到！" \
            -F "message=帅气的主人！🥺 要记得去 ipad 下载最新的摄影哦～" \
            -F "sound=Classical" \
            https://api.pushover.net/1/messages.json
