name: 每日维C提醒
 
on:
  schedule:
    # UTC 时间 05:00 = 北京时间 13:00
    - cron: '0 5 * * *'
  workflow_dispatch:  # 保留手动触发，方便测试

jobs:
 # 发送消息
  send-reminder:
    name: 发送维C提醒
    runs-on: ubuntu-latest
    
    steps:
      # 使用现成的 Pushover Action，不需要拉取代码
      - name: 发送 Pushover 通知
        uses: umahmood/pushover-actions@main
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        with:
          message: '主人主人！🍊 维C时间到！再不吃就要变成橘子干啦！'
          title: '🧐 维C时间'
          # 可选：添加声音提醒
          sound: 'magic'
